<div class="achievements-panel">
  <div class="achievements-header">
    <div>
      <p class="eyebrow">Панель организатора</p>
      <h3>Управление достижениями</h3>
    </div>
  </div>

  <div class="achievement-list">
    <article class="achievement-card">
      <div class="achievement-icon">📸</div>
      <div class="achievement-info">
        <h4>Первый кадр</h4>
        <span>Получили: Илья, Анна</span>
      </div>
      <button class="grant-btn" data-title="Первый кадр">Выдать</button>
    </article>

    <article class="achievement-card rare">
      <div class="achievement-icon">🎭</div>
      <div class="achievement-info">
        <h4>Мемолог</h4>
        <span>Получил: Илья</span>
      </div>
      <button class="grant-btn" data-title="Мемолог">Выдать</button>
    </article>

    <article class="achievement-card locked">
      <div class="achievement-icon">❔</div>
      <div class="achievement-info">
        <h4>Тайное достижение</h4>
        <span>Получили: никто</span>
      </div>
      <button class="grant-btn" data-title="Тайное достижение">Выдать</button>
    </article>
  </div>
</div>

<div class="modal-overlay" id="grantModal">
  <div class="modal-content">
    <div class="modal-header">
      <div>
        <p class="eyebrow">Выдача награды</p>
        <h4 id="modalTitle">Название достижения</h4>
      </div>
      <button class="close-btn" id="closeModal">×</button>
    </div>
    
    <div class="user-list">
      <label class="user-row">
        <div class="user-info">
          <div class="user-avatar">И</div>
          <span>Илья (u1)</span>
        </div>
        <input type="checkbox" name="user" value="u1" checked disabled>
        <span class="custom-cb"></span>
      </label>
      
      <label class="user-row">
        <div class="user-info">
          <div class="user-avatar">А</div>
          <span>Анна (u2)</span>
        </div>
        <input type="checkbox" name="user" value="u2">
        <span class="custom-cb"></span>
      </label>
      
      <label class="user-row">
        <div class="user-info">
          <div class="user-avatar">М</div>
          <span>Максим (u3)</span>
        </div>
        <input type="checkbox" name="user" value="u3">
        <span class="custom-cb"></span>
      </label>
    </div>

    <button class="submit-grant-btn" id="submitGrant">Выдать выбранным</button>
  </div>
</div>

<style>
  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background:
      linear-gradient(rgba(10, 10, 12, 0.72), rgba(10, 10, 12, 0.72)),
      repeating-linear-gradient(90deg, #202124 0, #202124 8px, #2b2c30 9px, #15161a 18px);
    font-family: Inter, Arial, sans-serif;
    color: white;
  }

  .achievements-panel {
    width: 360px; /* Сделал чуть шире для кнопок */
    padding: 18px;
    border-radius: 28px;
    background: rgba(12, 12, 16, 0.42);
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
  }

  .achievements-header {
    margin-bottom: 20px;
  }

  .eyebrow {
    margin: 0 0 4px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.56);
  }

  .achievements-header h3 {
    margin: 0;
    font-size: 20px;
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .achievement-list { display: grid; gap: 10px; }

  .achievement-card {
    display: grid;
    grid-template-columns: 46px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.1);
  }

  .achievement-card.rare {
    background: radial-gradient(circle at 0% 0%, rgba(255, 77, 109, 0.2), transparent 50%), rgba(255, 255, 255, 0.1);
  }

  .achievement-card.locked .achievement-icon {
    filter: grayscale(0.85);
    opacity: 0.7;
  }

  .achievement-icon {
    width: 46px;
    height: 46px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    font-size: 23px;
    background: rgba(255, 255, 255, 0.16);
  }

  .achievement-info h4 { margin: 0 0 4px; font-size: 14px; line-height: 1.1; }
  .achievement-info span { display: block; font-size: 12px; color: rgba(255, 255, 255, 0.6); }

  .grant-btn {
    padding: 8px 14px;
    border: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.15);
    color: white;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s;
  }

  .grant-btn:hover { background: rgba(255, 255, 255, 0.25); }

  /* Стили модального окна */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(4px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 100;
  }

  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }

  .modal-content {
    width: 320px;
    padding: 20px;
    border-radius: 24px;
    background: #1e1e24;
    border: 1px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    transform: translateY(10px);
    transition: transform 0.2s ease;
  }

  .modal-overlay.active .modal-content {
    transform: translateY(0);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .modal-header h4 { margin: 0; font-size: 18px; }

  .close-btn {
    background: none;
    border: none;
    color: rgba(255, 255, 255, 0.5);
    font-size: 24px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  .close-btn:hover { color: white; }

  .user-list {
    display: grid;
    gap: 8px;
    margin-bottom: 20px;
    max-height: 200px;
    overflow-y: auto;
  }

  .user-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 12px;
    background: rgba(255, 255, 255, 0.05);
    cursor: pointer;
    transition: background 0.2s;
  }

  .user-row:hover { background: rgba(255, 255, 255, 0.08); }
  .user-row:has(input:disabled) { opacity: 0.5; cursor: not-allowed; }

  .user-info {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .user-avatar {
    width: 28px;
    height: 28px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #41d3bd, #2b9383);
    font-size: 12px;
    font-weight: 800;
  }

  .user-row input { display: none; }

  .custom-cb {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 2px solid rgba(255, 255, 255, 0.3);
    display: grid;
    place-items: center;
    transition: all 0.2s;
  }

  .user-row input:checked + .custom-cb {
    background: #41d3bd;
    border-color: #41d3bd;
  }

  .user-row input:checked + .custom-cb::after {
    content: "✓";
    color: #151515;
    font-size: 14px;
    font-weight: 900;
  }

  .submit-grant-btn {
    width: 100%;
    padding: 12px;
    border: 0;
    border-radius: 14px;
    background: white;
    color: #151515;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
  }

  .submit-grant-btn:hover { background: #f0f0f0; }
</style>

<script>
  const modal = document.getElementById('grantModal');
  const modalTitle = document.getElementById('modalTitle');
  const closeBtn = document.getElementById('closeModal');
  const grantButtons = document.querySelectorAll('.grant-btn');
  const submitBtn = document.getElementById('submitGrant');

  // Открытие модалки
  grantButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      const title = btn.getAttribute('data-title');
      modalTitle.textContent = title;
      modal.classList.add('active');
    });
  });

  // Закрытие модалки
  const closeModal = () => {
    modal.classList.remove('active');
    // Сбрасываем выбранные незаблокированные чекбоксы при закрытии
    document.querySelectorAll('.user-row input:not(:disabled)').forEach(cb => cb.checked = false);
  };

  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });

  // Кнопка выдачи
  submitBtn.addEventListener('click', () => {
    const selected = Array.from(document.querySelectorAll('.user-row input:checked:not(:disabled)'))
                          .map(cb => cb.value);
    
    if (selected.length > 0) {
      alert(`Достижение "${modalTitle.textContent}" выдано пользователям: ${selected.join(', ')}!`);
      closeModal();
    } else {
      alert('Выберите хотя бы одного нового пользователя.');
    }
  });
</script>
