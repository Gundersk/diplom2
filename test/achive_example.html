<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Achievements Preview</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f4f1ea;
      color: #1f2937;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .preview {
      width: min(900px, 100%);
    }

    .title {
      margin: 0 0 24px;
      font-size: 28px;
      text-align: center;
    }

    .achievements {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
      gap: 18px;
    }

    .achievement {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
.achievement-icon {
  width: 72px;
  height: 72px;
  border-radius: 24px;

  background:
    linear-gradient(145deg, #fff3d8, #ead7b7);

  border: 1px solid rgba(156, 120, 70, 0.28);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.7),
    0 10px 24px rgba(120, 85, 40, 0.14);

  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 36px;
}

    .achievement-name {
      max-width: 90px;
      text-align: center;
      font-size: 12px;
      line-height: 1.2;
      color: #475569;
    }

    .achievement-icon:hover {
      transform: translateY(-3px);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.95),
        0 14px 30px rgba(15, 23, 42, 0.16);
    }
  </style>
</head>

<body>
